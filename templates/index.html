<!doctype html>
<html lang="en" data-bs-theme="light" data-theme="chrome">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local LLM Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Highlight.js dark styles for code syntax highlighting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" />
    <link rel="stylesheet" href="/static/style.css" />

    <!-- Dependencies for Markdown Parsing & Syntax Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>

    <!-- Inline theme.js to prevent flash of unstyled content -->
    <script>
      (function () {
        const savedTheme = localStorage.getItem("llm-theme") || "chrome";
        document.documentElement.setAttribute("data-theme", savedTheme);
        const bsTheme = savedTheme === "light" || savedTheme === "chrome" ? "light" : "dark";
        document.documentElement.setAttribute("data-bs-theme", bsTheme);
      })();
    </script>
  </head>
  <body>
    <div class="llm-app-wrapper d-flex flex-column" style="height: 100vh;">
      <!-- Header -->
      <header class="d-flex justify-content-between align-items-center px-4 header-container flex-shrink-0" style="height: 52px;">
        <div class="d-flex align-items-center gap-3">
          <div class="header-logo-icon">
            <i class="bi bi-robot"></i>
          </div>
          <span class="header-title" data-i18n="app_title">Local LLM Chat</span>
        </div>
        <div class="d-flex gap-2 align-items-center">
          <div class="lang-switcher">
            <button class="lang-btn" data-lang-val="en" title="English">🇬🇧</button>
            <button class="lang-btn" data-lang-val="hu" title="Magyar">🇭🇺</button>
            <button class="lang-btn" data-lang-val="et" title="Eesti">🇪🇪</button>
          </div>
          <div class="theme-switcher">
            <button class="theme-btn" data-theme-val="light" title="Light mode">
              <i class="bi bi-sun-fill"></i><span data-i18n="theme_light">Light</span>
            </button>
            <button class="theme-btn" data-theme-val="dark" title="Dark mode">
              <i class="bi bi-moon-stars-fill"></i><span data-i18n="theme_dark">Dark</span>
            </button>
            <button class="theme-btn" data-theme-val="chrome" title="Chrome style">
              <i class="bi bi-google"></i><span data-i18n="theme_chrome">Chrome</span>
            </button>
          </div>
        </div>
      </header>

      <!-- Main Chat Area -->
      <div class="d-flex flex-grow-1 overflow-hidden">
        <div class="glass-panel chat-card d-flex w-100 overflow-hidden" style="border-radius: 0; border: none;">
          <!-- Sidebar -->
          <aside class="chat-sidebar collapsed" id="chat-sidebar">
            <div class="chat-sidebar-header d-flex justify-content-between align-items-center p-3 border-bottom border-secondary-subtle">
              <button class="new-chat-btn btn btn-sm rounded px-3 py-2 w-100 text-start d-flex align-items-center gap-2" id="newChatBtn">
                <i class="bi bi-plus-lg"></i>
                <span data-i18n="btn_new_chat">New Chat</span>
              </button>
              <button class="icon-btn ms-2" id="collapseSidebarBtn" title="Hide history">
                <i class="bi bi-layout-sidebar"></i>
              </button>
            </div>
            <div class="chat-sidebar-scroll p-2">
              <div class="chat-sidebar-group-title px-2 py-1 text-uppercase text-muted small fw-bold" data-i18n="sidebar_recent">
                Recent
              </div>
              <div id="chatHistoryList" class="d-flex flex-column gap-1 mt-1">
                <div class="chat-sidebar-item active-chat-item px-2 py-2 rounded d-flex align-items-center" id="currentChatTab">
                  <i class="bi bi-chat-square-text me-2"></i>
                  <span data-i18n="chat_current">Current Chat</span>
                </div>
              </div>
            </div>
            <div class="chat-sidebar-footer p-3 border-top border-secondary-subtle d-flex align-items-center justify-content-between">
              <div class="user-profile d-flex align-items-center gap-2">
                <div class="avatar-circle">U</div>
                <span class="small fw-medium" data-i18n="user_local">Local User</span>
              </div>
            </div>
          </aside>

          <!-- Main Chat -->
          <div class="chat-main d-flex flex-column flex-grow-1">
            <!-- Chat Top Nav -->
            <nav class="chat-top-nav d-flex align-items-center justify-content-between px-3 py-2 border-bottom border-secondary-subtle">
              <div class="d-flex align-items-center gap-2">
                <div class="chat-model-selector-container position-relative">
                  <button
                    class="chat-model-selector d-flex align-items-center gap-1 px-2 py-1 rounded cursor-pointer border-0"
                    id="modelSelectorBtn"
                    type="button"
                    aria-haspopup="listbox"
                    aria-label="Model selector"
                  >
                    <span class="small fw-semibold" id="active-model-name">Qwen 2.5 (7B)</span>
                    <i class="bi bi-chevron-down small" style="font-size: 0.75rem"></i>
                  </button>
                  <div
                    class="chat-model-dropdown glass-panel d-none position-absolute mt-1 p-1 rounded"
                    id="modelDropdownMenu"
                    style="z-index: 1050; min-width: 160px; top: 100%; left: 0;"
                  >
                    <div class="chat-dropdown-item active px-3 py-2 rounded small cursor-pointer" data-model="qwen2.5:7b">
                      qwen2.5:7b
                    </div>
                    <div class="chat-dropdown-item px-3 py-2 rounded small cursor-pointer" data-model="qwen2.5:14b">
                      qwen2.5:14b
                    </div>
                    <div class="dropdown-divider my-1 border-bottom border-secondary-subtle"></div>
                    <div class="chat-dropdown-item px-3 py-2 rounded small cursor-pointer d-flex align-items-center gap-2" id="configure-api-btn">
                      <i class="bi bi-gear-fill text-muted"></i>
                      <span data-i18n="menu_settings">Settings...</span>
                    </div>
                  </div>
                </div>
              </div>
            </nav>

            <!-- Message List -->
            <div class="chat-container flex-grow-1 overflow-y-auto px-3 py-3" id="chatContainer">
              <div class="chat-max-width">
                <!-- Welcome Screen -->
                <div class="chat-empty-state d-flex flex-column align-items-center justify-content-center text-center my-4" id="emptyState">
                  <div class="chat-empty-logo d-flex align-items-center justify-content-center rounded-circle mb-3">Q</div>
                  <h4 class="chat-empty-title fw-bold mb-4" data-i18n="chat_empty_title">How can I help today?</h4>
                </div>
                <!-- Active message feed -->
                <div id="messageFeed" class="d-flex flex-column gap-3 w-100"></div>
              </div>
            </div>

            <!-- Input Footer -->
            <footer class="chat-input-area-wrapper px-3 pb-3 border-top border-secondary-subtle pt-3">
              <div class="chat-max-width">
                <form id="promptForm">
                  <div class="chat-input-container d-flex align-items-end p-2 rounded-4">
                    <button type="button" class="icon-btn me-2 mb-1" id="expandSidebarBtn" title="Show history">
                      <i class="bi bi-layout-sidebar"></i>
                    </button>
                    <textarea
                      aria-label="Ask something..."
                      id="promptInput"
                      class="chat-textarea flex-grow-1 border-0 bg-transparent px-2"
                      placeholder="Ask something..."
                      data-i18n-placeholder="chat_input_placeholder"
                      rows="1"
                      required
                    ></textarea>
                    <button
                      type="submit"
                      class="send-btn btn rounded-circle p-1 d-flex align-items-center justify-content-center"
                      id="submitBtn"
                      title="Send"
                    >
                      <i class="bi bi-arrow-up-short" style="font-size: 1.35rem; line-height: 1"></i>
                    </button>
                  </div>
                </form>
                <div class="chat-disclaimer text-center mt-2 text-muted" style="font-size: 0.7rem" data-i18n="chat_disclaimer">
                  The AI can make mistakes. Verify important information!
                </div>
              </div>
            </footer>
          </div>
        </div>
      </div>
    </div>

    <!-- API Config Modal -->
    <div class="custom-modal-overlay d-none" id="apiConfigModal">
      <div class="custom-modal glass-panel p-4 rounded-4 shadow">
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom border-secondary-subtle">
          <h5 class="m-0 fw-bold" data-i18n="modal_title">Server Settings</h5>
          <button type="button" class="btn-close-custom" id="close-api-modal-btn">
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
        <div class="mb-3">
          <label for="api-url-input" class="form-label text-muted small fw-semibold mb-1" data-i18n="modal_api_url">Prompt API URL</label>
          <input type="url" class="form-control rounded-pill px-3" id="api-url-input" placeholder="http://localhost:5000/prompt" />
          <div class="form-text text-muted px-2" style="font-size: 0.72rem">
            Local Flask backend (e.g. http://localhost:5000/prompt) or direct Ollama (e.g. http://localhost:11434/api/chat).
          </div>
        </div>
        <div class="mb-3">
          <label for="model-name-input" class="form-label text-muted small fw-semibold mb-1" data-i18n="modal_model_name">Model Name</label>
          <input type="text" class="form-control rounded-pill px-3" id="model-name-input" placeholder="qwen2.5:7b" />
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4 pt-2 border-top border-secondary-subtle">
          <button type="button" class="btn btn-sm btn-secondary rounded-pill px-3" id="cancel-api-modal-btn" data-i18n="btn_cancel">Cancel</button>
          <button type="button" class="btn btn-sm btn-primary rounded-pill px-3" id="save-api-config-btn" data-i18n="btn_save">Save</button>
        </div>
      </div>
    </div>

    <script src="/static/script.js"></script>
  </body>
</html>
