# docker-compose.yml  –  PROD environment
# Usage: docker compose -f docker-compose.prod.yml up --build -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod          # uses the "prod" stage
    image: local-llm:prod
    container_name: local-llm-prod
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      OLLAMA_HOST: http://host.docker.internal:11434
    volumes:
      # Only persist ChromaDB – source is baked into the image
      - chroma_prod:/app/chroma_memory
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  chroma_prod:
